[workspace]
changelog_update = true
git_tag_enable = true
git_release_enable = true
git_release_type = "auto"
git_release_body = "{{ changelog }}"
release_commits = "^(feat|fix|perf|refactor)"
features_always_increment_minor = true
semver_check = false
release_always = false
pr_name = "chore: release{% if version %} v{{ version }}{% endif %}"
pr_body = """
{% for release in releases %}{{ release.package }}: {{ release.previous_version }} -> {{ release.next_version }}
{% if release.changelog %}
{{ release.changelog }}
{% endif %}{% endfor -%}
"""

[[package]]
name = "dataseek"
changelog_path = "docs/CHANGELOG.md"

[changelog]
header = """# Changelog

What shipped, newest first. release-plz writes each section from the conventional commits merged since the previous tag; see [`reference/release.md`](reference/release.md).
"""
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}Breaking: {% endif %}{{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
commit_parsers = [
  # The never-download catalog design, replaced by background downloads
  # before 0.9.0 shipped; its lines would describe behavior no release has.
  { sha = "fda0c484b114c828eb45f1211be0374f21dc948c", skip = true },
  { sha = "87feb88d7e772bf61d0de28371d2920e080626ab", skip = true },
  { sha = "8f5ffe70db718415153d22132ab14075d04769f1", skip = true },
  { sha = "7a31886df8726dcc357d05b025b9c31d6d74cf82", skip = true },
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^perf", group = "performance" },
  { message = "^refactor", group = "changed" },
  { message = "^doc", group = "docs" },
  { message = "^build", group = "other" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "other" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^Merge ", skip = true },
  { message = ".*", group = "uncategorized" },
]
