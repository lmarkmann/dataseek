name: ci

# One Linux machine runs every check as a named step. The OS matrix this replaced
# (ubuntu, macOS, Windows) guarded two things: path layouts, which etcetera resolves
# as XDG on every Unix and differently only on Windows, and cfg boundaries that fail
# to compile off Linux, which is how the unconditional SIGPIPE import once slipped
# through. The second is caught below by clippy on the Windows and macOS targets from
# this machine; a macOS or Windows runner on a private repo would cost 10x and 2x.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install
      - name: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: tools
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-nextest,cargo-deny,cargo-shear,typos,zizmor
          fallback: none
      - name: fmt
        run: cargo fmt --all --check
      # The doc comments in src/cli.rs are the --help text, so a typo there is a
      # user-visible defect the other steps look straight past.
      - name: typos
        run: typos
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: cross-check
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          cargo clippy --all-targets --all-features --locked --target x86_64-pc-windows-msvc
          cargo clippy --all-targets --all-features --locked --target aarch64-apple-darwin
      # nextest skips doctests by design; this crate is a binary and has none.
      - name: test
        run: cargo nextest run --workspace --all-features --locked
      - name: deny
        run: cargo deny check advisories licenses bans sources
      - name: shear
        run: cargo shear
      - name: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --format=github .
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Last: it installs a second toolchain, and everything above failing first
      # is cheaper than waiting for it.
      - name: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version | select(.)] | sort_by(split(".") | map(tonumber)) | last')
          rustup toolchain install "$msrv" --profile minimal
          RUSTUP_TOOLCHAIN="$msrv" cargo check --workspace --all-targets --all-features --locked
