# CodSpeed's CPU simulation of benches/search.rs: docs/adr/0012-benchmarks-criterion-local-codspeed-ci.md.
name: codspeed

on:
  # Unfiltered, so every commit on main is a baseline a pull request can be compared with.
  push:
    branches: [main]
  pull_request:
    paths:
      - src/**
      - benches/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/codspeed.yml
  # Lets CodSpeed backfill runs for older commits.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC upload to CodSpeed
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup update --no-self-update
          rustup toolchain install
      - name: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same version as the codspeed crate in Cargo.lock; the two move together.
      - name: tools
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-codspeed@6.1.0
          fallback: cargo-binstall
      - name: build
        run: cargo codspeed build --features internals --locked
      - name: run
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run
