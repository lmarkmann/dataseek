# `release` tags, cuts the GitHub release and publishes whatever is unreleased;
# `release-pr` opens or updates the release PR and queues it for auto-merge.
#
# Two jobs on purpose (docs/release.md): GitHub cancels a *pending* run
# in a concurrency group whenever a newer one queues, whatever cancel-in-progress
# says. With release_always = false only the release PR's merge commit cuts the
# tag, so a grouped `release` could be discarded while pending and the tag lost
# with no failure. `release` therefore has no group; `release-pr` is serialized
# because two runs writing the release branch race.
#
# Git-only: the crate is publish = false, so there is no id-token and no registry
# token. The App token (lmarkmann-release) is what lets CI run on the release PR and
# the merge trigger the next release run; GITHUB_TOKEN events trigger neither. See
# docs/release.md.
name: release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install
      - name: release
        uses: release-plz/action@d6c56271d640b6c1b61d1e00593641c400a9f4bd # v0.5.138
        with:
          command: release
          token: ${{ steps.app.outputs.token }}

  release-pr:
    needs: release
    if: ${{ !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install
      - name: release-pr
        id: pr
        uses: release-plz/action@d6c56271d640b6c1b61d1e00593641c400a9f4bd # v0.5.138
        with:
          command: release-pr
          token: ${{ steps.app.outputs.token }}
      - name: automerge
        if: steps.pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ fromJSON(steps.pr.outputs.pr).number }}
        run: gh pr merge --auto --squash "$PR"
