[package]
name = "dataseek"
version = "0.4.2"
description = "Search for datasets from the terminal"
edition = "2024"
rust-version = "1.99"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
dbg_macro = "deny"
todo = "deny"
exit = "deny"
struct_excessive_bools = "allow"
doc_markdown = "allow"

[dependencies]
anyhow = "1"
anstream = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
etcetera = "0.11"
indicatif = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

# TLS per platform: the OS's own stack on Windows and macOS (SChannel,
# Security.framework), rustls on everything else. ring, rustls' crypto, builds
# C against the target's system headers, which the Linux CI runner does not
# have for Windows or macOS, so this split is what lets ADR 0002's
# cross-checks compile (ADR 0011). src/http.rs picks the matching provider.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3", features = ["json"] }

[features]
# Re-exports for benches/ only; see the internals module in src/lib.rs.
internals = []

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "5", package = "codspeed-criterion-compat", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1", features = ["filters"] }
predicates = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release as shipped, with line tables kept so CodSpeed flamegraphs resolve
# symbols (ADR 0012).
[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"

[[bench]]
name = "search"
harness = false
required-features = ["internals"]
