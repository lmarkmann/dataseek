[package]
name = "dataseek"
version = "0.7.0"
description = "Search for datasets from the terminal"
repository = "https://github.com/lmarkmann/dataseek"
edition = "2024"
rust-version = "1.99"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
dbg_macro = "deny"
todo = "deny"
exit = "deny"
struct_excessive_bools = "allow"
doc_markdown = "allow"

[dependencies]
anyhow = "1"
anstream = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
etcetera = "0.11"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

# TLS per platform: the OS's own stack on Windows and macOS (SChannel,
# Security.framework), rustls on everything else. ring, rustls' crypto, builds
# C against the target's system headers, which the Linux CI runner does not
# have for Windows or macOS, so this split is what lets ADR 0002's
# cross-checks compile (ADR 0011). Every platform trusts the OS's root
# certificates; platform-verifier gives rustls the system store (ADR 0014).
# src/http.rs picks the matching provider.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }

# rustls itself only to tell a refused certificate from a dead host.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }

[features]
# Re-exports for benches/ and the relevance example only; see the internals
# module in src/lib.rs.
internals = []

[dev-dependencies]
allocation-counter = "0.8"
assert_cmd = "2"
criterion = { version = "5", package = "codspeed-criterion-compat", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1", features = ["filters"] }
predicates = "3"
proptest = "1"

# A local HTTPS server under a private root, for the test that Linux trusts
# what SSL_CERT_FILE names; rustls with ring is already in the build there.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = 3
# Fat LTO lets the optimizer drop and merge code across every crate at once.
lto = "fat"
codegen-units = 1
strip = "symbols"

# Dependencies optimized for size; fat LTO inlines the hot ones into this
# crate's own code, which stays at opt-level 3 (docs/bench/2026-10-07-binary-size.md).
[profile.release.package."*"]
opt-level = "z"

# Release as shipped, with line tables kept so CodSpeed flamegraphs resolve
# symbols (ADR 0012).
[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"

[[bench]]
name = "search"
harness = false
required-features = ["internals"]

# The relevance benchmark: docs/reference/development.md.
[[example]]
name = "relevance"
required-features = ["internals"]
test = true
