# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all --",
    language = "system",
    types = ["rust"],
    pass_filenames = false
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --all-targets --all-features --locked -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false
  },
  # Runs in milliseconds and catches the dependency you stopped using two
  # commits ago. Triggers on the manifest too, not just on Rust sources.
  {
    id = "cargo-shear",
    name = "cargo shear",
    entry = "cargo shear",
    language = "system",
    files = "(\\.rs$|^Cargo\\.toml$)",
    pass_filenames = false
  }
]

# The doc comments in src/cli.rs *are* the --help text, so a typo there ships to
# users. This is the only hook that reads prose rather than code. Pinned to a
# tag and fetched by prek, so a clone needs nothing on PATH for it to run.
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [{ id = "typos" }]
