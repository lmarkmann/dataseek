#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all --",
    language = "system",
    types = ["rust"],
    pass_filenames = false
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --all-targets --all-features --locked -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false
  },
  {
    id = "cargo-shear",
    name = "cargo shear",
    entry = "cargo shear",
    language = "system",
    files = "(\\.rs$|^Cargo\\.toml$)",
    pass_filenames = false
  }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.3"
hooks = [{ id = "typos" }]
