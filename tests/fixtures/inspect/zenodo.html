    <meta name="description" content="Description The dataset is constituted by three .csv files, which contain the measurements performed in an experiment aiming to evaluate the influence of rain on temperature readings. Two devices under tests (DUTs), one naturally ventilated and one artificially ventilated, are compared with a reference system. A .csv file is produced for DUT1, DUT2 and the reference system. Here below the content of each file is briefly described: Dataset_reference:  accurate air temperature measurements obtained using the reference system, which is not affected by rain. The system is constituted by four aspirated thermometers (called Meteo1, Meteo2, Meteo 3, Meteo 4) manufactured at the Danish Technology Institute. The column &#34;PT500&#34; contains instead the rain temperature measurements. The readings are produced using a Fluke Super-DAQ (1586A).  Dataset_DUT1: measurements of the naturally ventilated thermometer under an artificially generated rainfall. The readings are produced using the manufacturer datalogger. Dataset_DUT2: measurements of the artificially ventilated thermometer under an artificially generated rainfall. The readings are produced using the manufacturer datalogger." />
