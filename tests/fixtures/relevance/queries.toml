# The relevance benchmark's queries. `just relevance` scores the merged
# ranking of each against judgments.tsv, from the per-source lists frozen in
# retrieval/; docs/reference/development.md explains the workflow.
#
# kind:
#   known    names one dataset; scored by where its first target lands
#   topical  keywords, the way a person types them; scored by graded labels
#   natural  a sentence, the way an agent phrases a need; graded labels
#
# category is the domain the query belongs to, using the `--category` names;
# every query is still run against every default source, as a plain search
# would be.
#
# half splits the set before any ranking change is tuned: changes are chosen
# on `tune` and adopted only if they also help `held`. Within each kind the
# queries are sorted by category and id and assigned alternately. Never move
# a query between halves after looking at its scores.
#
# targets (known only) are the dataset's identifiers: DOIs and the canonical
# landing pages on the hubs dataseek searches. A hit matches when it shares
# any identity key with a target. evidence says where each identifier was
# confirmed.

