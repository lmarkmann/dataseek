134/3"],null,null,["Sea Ice, Sentinel 1, Synthetic Aperture Radar, Microwave Radiometry, Arctic research, Cryosphere, deep learning dataset, Earth Sciences not elsewhere classified"],null,["pdf"],null,null,[[8]],[["Roberto Saldo; Matilde Brandt Kreiner; Jørgen Buus-Hinkler; Leif Toudal Pedersen; David Malmgren-Hansen; Allan Aasbjerg Nielsen; Henning Skriver (2023). AI4Arctic / ASIP Sea Ice Dataset - version 2 [Dataset]. http://doi.org/10.11583/DTU.13011134.v3",[null,"Roberto Saldo; Matilde Brandt Kreiner; Jørgen Buus-Hinkler; Leif Toudal Pedersen; David Malmgren-Hansen; Allan Aasbjerg Nielsen; Henning Skriver (2023). AI4Arctic / ASIP Sea Ice Dataset - version 2 [Dataset]. http://doi.org/10.11583/DTU.13011134.v3"]]],null,null,null,null,null,null,"10.11583/DTU.13011134.v3",null,null,null,[["Technical University of Denmark"]],null,[[null,"<p>The AI4Arctic / ASIP Sea Ice Dataset - version 2 (ASID-v2) contain \n461 Sentinel-1 Synthetic Aperture Radar (SAR) scenes matched with sea \nice charts produced by the Danish Meteorological Institute in 2018-2019.\nIce charts contain sea ice concentration, stage of development and \nform of ice, provided in manual drawn polygons. The ice charts have been\n projected into the the S1 geometry for easy use as labels in deep \nlearning or other machine learning algorithm training\n processes.\nThe dataset also includes AMSR2 microwave radiometer sensor \nmeasurements to compliment the learning of the of sea ice concentrations\n although in a much lower resolution than the Sentinel-1 data.\nDetails are described in the manual that is published together with the dataset.The manual has been revised, the latest is the 30-09-2020 version.</p>"]],9,"\"10.11583 dtu 13011134 v3\" OR \"dtu dk articles dataset ai4arctic_asip_sea_ice_dataset_ _version_2 13011134\"","https://doi.org/10.1109/TGRS.2020.3004539",null,"Roberto Saldo; Matilde Brandt Kreiner; Jørgen Buus-Hinkler; Leif Toudal Pedersen; David Malmgren-Hansen; Allan Aasbjerg Nielsen; Henni
